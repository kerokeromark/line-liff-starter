<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content=#183c2e><title>ギョレメ音声ガイド</title><style>
*{box-sizing:border-box}:root{--bg:#f2efe7;--c:#fffdf8;--i:#17221c;--m:#667169;--g:#176b49;--l:#d8d3c7}body{margin:0;background:var(--bg);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.65;padding-bottom:110px}header{padding:calc(25px + env(safe-area-inset-top)) 18px 22px;background:linear-gradient(145deg,#174631,#1b2922);color:#fff;border-radius:0 0 28px 28px}header small{letter-spacing:.12em;font-weight:800;opacity:.75}h1{font-size:30px;line-height:1.1;margin:7px 0}header p{font-size:14px;opacity:.85;margin:0}main{max-width:720px;margin:auto;padding:16px}.note{background:var(--c);border:1px solid var(--l);border-radius:15px;padding:12px 14px;font-size:13px;color:var(--m)}#q{width:100%;height:50px;border:1px solid var(--l);border-radius:15px;background:var(--c);font-size:16px;padding:0 14px;margin:14px 0}#list{display:grid;gap:11px}.s{display:grid;grid-template-columns:49px 1fr 22px;gap:11px;align-items:center;width:100%;min-height:82px;padding:13px;border:1px solid var(--l);border-radius:18px;background:var(--c);text-align:left;color:var(--i);box-shadow:0 7px 20px #14231b14}.s:active{transform:scale(.99)}.num{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#e8eee9;color:var(--g);font-weight:900}.st{font-size:16px;font-weight:850;line-height:1.25}.tr{font-size:12px;color:var(--m);margin-top:3px}.ar{font-size:24px;color:var(--m)}dialog{width:min(720px,100%);max-height:91vh;margin:auto 0 0;border:0;border-radius:25px 25px 0 0;background:var(--c);color:var(--i);padding:10px 18px calc(28px + env(safe-area-inset-bottom));overflow:auto}dialog::backdrop{background:#0008}.bar{width:44px;height:5px;background:var(--l);border-radius:9px;margin:0 auto 13px}.head{display:flex;gap:11px;align-items:start}.head h2{font-size:23px;line-height:1.25;margin:1px 0}.sub{font-size:13px;color:var(--m)}.x{margin-left:auto;width:44px;height:44px;border:1px solid var(--l);border-radius:13px;background:#f0eee8;font-size:20px}.look{margin:15px 0;padding:13px;background:#efede6;border-radius:15px}.look ul{font-size:14px;margin:5px 0 0;padding-left:20px}.play{width:100%;height:57px;border:0;border-radius:16px;background:var(--g);color:#fff;font-size:17px;font-weight:900}.txt{font-size:15px;margin-top:15px;border-top:1px solid var(--l);padding-top:14px}#p{display:none;position:fixed;z-index:9;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:700px;margin:auto;background:#101914;color:#fff;border-radius:21px;padding:12px;box-shadow:0 14px 35px #0006}#p.on{display:block}.row{display:flex;align-items:center;gap:8px}.b{width:44px;height:44px;border:0;border-radius:13px;background:#2c3a32;color:#fff;font-size:19px}.b.main{background:#fff;color:#142019}.info{min-width:0;flex:1}.info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.info span{font-size:11px;opacity:.65}.prog{height:4px;background:#34443b;border-radius:99px;margin-top:9px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:#73d9a6}.rates{display:flex;gap:6px;margin-top:8px}.r{height:29px;min-width:44px;border:0;border-radius:9px;background:#2c3a32;color:#fff;font-size:11px;font-weight:800}.r.on{background:#fff;color:#142019}@media(min-width:760px){dialog{margin:auto;border-radius:25px}}</style>
<header><small>UNOFFICIAL MOBILE AUDIO GUIDE</small><h1>ギョレメ<br>音声ガイド</h1><p>スポットを選び、イヤホンで再生。iPhoneの日本語音声で案内します。</p></header><main><div class=note><b>使い方：</b>看板と同じスポット名を押し「ガイドを再生」。最初の再生だけ端末の操作許可が必要な場合があります。公開範囲・撮影・料金は現地表示を優先してください。</div><input id=q placeholder="暗闇、Karanlık、蛇…"><div id=list></div></main>
<dialog id=d><div class=bar></div><div class=head><div class=num id=dn></div><div><h2 id=dt></h2><div class=sub id=ds></div></div><button class=x id=cl>×</button></div><div class=look><b>👀 ここを見る</b><ul id=dl></ul></div><button class=play id=go>▶ ガイドを再生</button><div class=txt id=dx></div></dialog>
<div id=p><div class=row><button class=b id=pr>‹</button><button class="b main" id=pa>⏸</button><button class=b id=st>■</button><div class=info><strong id=pt></strong><span id=ps></span></div><button class=b id=nx>›</button></div><div class=prog><i id=pg></i></div><div class=rates><button class=r data-v=.85>0.85</button><button class="r on" data-v=1>1.0</button><button class=r data-v=1.2>1.2</button><button class=r data-v=1.4>1.4</button></div></div>
<script>const S=[{"n":"00","id":"intro","t":"入口：まず全体像","tr":"Göreme Açık Hava Müzesi","x":"ここは、迫害された初期キリスト教徒が一時的に隠れた洞窟、というより、ビザンツ時代に長く使われた修道院キャンパスです。公式資料では、4世紀から13世紀まで修道生活が営まれたとされますが、今日見られる華やかな壁画の中心は10世紀から12世紀です。谷の中に教会、礼拝堂、食堂、台所、墓、居住空間がまとまっており、信仰・教育・生活が一体化していました。これからは、岩の奇景だけでなく、ここが一つの社会だったと想像しながら歩いてください。","look":["谷全体が、自然の岩山ではなく宗教施設の集合体になっていること","教会だけでなく、食堂・台所・墓・居住空間があること","岩を積んだのではなく、柔らかな凝灰岩を内側へ掘り進めて造ったこと"]},{"n":"01","id":"monastery","t":"修道院群","tr":"Rahibeler ve Rahipler Manastırı","x":"入口付近の大きな岩塊は、伝統的に女子修道院・男子修道院と呼ばれています。重要なのは名称より、教会だけでなく食堂、台所、倉庫、居室が複数階にまとまっている点です。修道生活は、一人で洞窟にこもるだけではありません。共同で祈り、働き、食べ、学ぶ日常がありました。崩落や安全上の理由で入れない階も多いので、今見えている部分だけで全体像を判断しないでください。","look":["岩塊の中に複数階が重なっていること","小さな部屋、通路、台所、食堂が一体化している構造","現在見える範囲より、もともとの施設が大きかったこと"]},{"n":"02","id":"basil","t":"聖バジル礼拝堂","tr":"Aziz Basil Şapeli","x":"この礼拝堂は11世紀のものです。名前の聖バジルは、4世紀にカイセリを拠点とし、共同生活型の修道思想に大きな影響を与えた人物ですが、この建物を本人が造ったわけではありません。入口側の床には墓穴があります。壁では、馬上の聖ゲオルギオスや聖テオドロスを探してください。彼らは悪や異教を退ける戦う聖人として、カッパドキアで特に人気がありました。","look":["入口側の床にある墓穴","馬に乗る聖ゲオルギオスと聖テオドロス","礼拝堂は11世紀で、4世紀の聖バジル本人が造ったわけではないこと"]},{"n":"03","id":"elmali","t":"エルマル教会","tr":"Elmalı Kilise","x":"エルマル教会は11世紀半ばから12世紀初頭の建物で、四本の柱、九つのドーム状区画、三つの後陣を持ちます。岩を掘っただけなのに、石造教会のような複雑な建築を再現している点が見どころです。壁には、赤い十字や幾何学模様の古い装飾と、その後に描かれた人物画が共存します。誕生、洗礼、最後の晩餐、磔刑、復活へと、キリストの生涯を追う映像教材のように見てください。","look":["四本の柱と九つのドーム状区画","赤い線の古い装飾と、その上の人物画","キリストの生涯が場面ごとに連続していること"]},{"n":"04","id":"barbara","t":"聖バルバラ礼拝堂","tr":"Azize Barbara Şapeli","x":"聖バルバラ礼拝堂は11世紀後半のものです。ここでは華麗な人物画より、岩肌に直接描かれた赤い幾何学模様、動物、軍事的な記号に注目してください。一部は、岩窟なのに石を積んだ建物のように見せる装飾です。つまり、洞窟をそのまま受け入れるのではなく、理想の教会建築へ視覚的に変換しています。北側では、聖ゲオルギオスと聖テオドロスが竜と戦う場面を探してください。","look":["岩肌へ直接描かれた赤い幾何学模様","石積みを模倣したような模様","聖ゲオルギオスと聖テオドロスの竜退治"]},{"n":"05","id":"refectory","t":"食堂・台所","tr":"Yemekhane ve Mutfak","x":"ここでは壁画より、岩から直接彫り出された長い食卓とベンチを見てください。修道士たちは、祈るだけでなく、共同で働き、食べ、生活しました。食事は娯楽的な宴会ではなく、共同体の規律を確認する時間でもあります。教会の壮麗さと比べて設備が簡素なのは、禁欲を重視した生活をよく表しています。谷全体が宗教施設であると同時に、一つの生活インフラだったことが分かります。","look":["岩から削り残された長い食卓とベンチ","教会以外にも、共同体の生活機能が揃っていたこと","豪華な宴会場ではなく、規律ある共同食の場所だったこと"]},{"n":"06","id":"yilanli","t":"蛇の教会","tr":"Yılanlı Kilise / Aziz Onuphrius Kilisesi","x":"蛇の教会は11世紀。名前の蛇は、聖ゲオルギオスと聖テオドロスが退治する竜が、細長い蛇のように見えることに由来します。もう一人の主役は、裸身を長い髪で覆う聖オヌフリウス。砂漠で禁欲生活を送った隠者として表現されています。建築を見ると、後陣が左の長い壁に掘られ、空間は未完成のままです。完成品だけでなく、岩窟教会がどう造られていたかを感じられる場所です。","look":["聖ゲオルギオスと聖テオドロスが戦う“蛇のような竜”","長い髪で身体を覆う聖オヌフリウス","左側の壁に後陣があり、建築が未完成であること"]},{"n":"07","id":"dark","t":"暗闇の教会","tr":"Karanlık Kilise","x":"ここは最大の見どころ、暗闇の教会です。11世紀末から12世紀初頭のもので、小さな窓からしか光が入らなかったため、壁画の色が例外的に鮮やかに残りました。暗さが保存装置になったわけです。中では一枚に集中せず、誕生から洗礼、最後の晩餐、裏切り、磔刑、冥府降下、空の墓、昇天まで、キリストの物語が空間全体を包む構成を見てください。撮影は必ず現地表示に従ってください。","look":["小窓しかなく暗いため、色が鮮やかに残ったこと","中央ドーム、四本の柱、三つの後陣という本格的な構成","最後の晩餐、裏切り、磔刑、冥府降下、昇天の連続"]},{"n":"08","id":"catherine","t":"聖カタリナ礼拝堂","tr":"Azize Catherine Şapeli","x":"この11世紀の礼拝堂は、暗闇の教会とサンダルの教会の間にあります。前室の床には墓があり、壁画はアンナという人物の寄進で制作されたと伝わります。ここから、修道院の美術が匿名の信仰だけでなく、具体的な寄進者の資金と願いによって支えられていたことが分かります。聖カタリナ、聖ゲオルギオス、聖テオドロス、三人の教父を探してください。","look":["前室の床にある墓","壁画を寄進した人物として記録されるアンナ","聖ゲオルギオス、聖テオドロス、聖カタリナ"]},{"n":"09","id":"carikli","t":"サンダルの教会","tr":"Çarıklı Kilise","x":"サンダルの教会は12世紀末から13世紀初頭。名前は、キリスト昇天図の下にある二つの足跡状の窪みから来たと考えられています。聖なる足跡という伝説的な連想はできますが、実際のキリストの足跡ではありません。中央ドームの全能者キリスト、聖母子、天使ミカエル、昇天の場面を探してください。人物が大きく細長く描かれる点も特徴です。","look":["昇天図の下にある二つの足跡状の窪み","中央ドームの全能者キリスト","エルマル教会・暗闇の教会と似た図像と、より大きく細長い人物"]},{"n":"10","id":"tokali","t":"トカル教会","tr":"Tokalı Kilise","x":"トカル教会は主区域の外側にあり、見落としやすいので注意してください。10世紀末から11世紀初頭の、地域最古級かつ最大級の岩窟教会です。最大の特徴は濃い青。壁画は帯状に区切られ、キリストの誕生から奇跡、最後の晩餐、磔刑、復活、昇天までが右から左へ展開します。巨大な宗教コミック、あるいは映画の絵コンテを見る感覚で追うと分かりやすいです。","look":["濃い青を基調とした大画面の壁画","旧教会・新教会など四つの空間が連結する構成","キリストの生涯が右から左へ、帯状に展開すること"]},{"n":"＋","id":"fresco","t":"壁画の読み方","tr":"Freskleri Okuma Rehberi","x":"壁画を見るコツは三つです。第一に、赤い線だけの直接描画と、下地を施した人物画を分けて見ること。第二に、上には天上のキリストや天使、下には地上の物語が置かれるという空間の序列を見ること。第三に、誕生から受難、復活、昇天までを連続物語として追うことです。顔の傷は、すべて特定の宗教勢力の破壊と決めつけず、自然劣化や後世の損傷も含めて慎重に見ましょう。","look":["赤い線画と、下地の上に描かれた人物画の違い","ドーム・後陣・壁の高さによる図像の序列","顔の損傷を一つの原因だけで説明しないこと"]}],sy=speechSynthesis;let sel,cur,ch=[],i=0,v=1,on=0;const $=x=>document.getElementById(x),L=$('list'),D=$('d');function e(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function draw(z=''){z=z.toLowerCase();L.innerHTML='';S.filter(s=>(s.t+s.tr+s.x).toLowerCase().includes(z)).forEach(s=>{let b=document.createElement('button');b.className='s';b.innerHTML=`<div class=num>${s.n}</div><div><div class=st>${e(s.t)}</div><div class=tr>${e(s.tr)}</div></div><div class=ar>›</div>`;b.onclick=()=>open(s);L.appendChild(b)})}function open(s){sel=s;$('dn').textContent=s.n;$('dt').textContent=s.t;$('ds').textContent=s.tr;$('dl').innerHTML=s.look.map(x=>`<li>${e(x)}</li>`).join('');$('dx').textContent=s.x;D.showModal()}function parts(t){return t.split(/(?<=[。！？])/).map(x=>x.trim()).filter(Boolean)}function voice(){let a=sy.getVoices();return a.find(x=>x.lang==='ja-JP')||a.find(x=>x.lang.startsWith('ja'))}function start(s=sel){if(!s)return;sy.cancel();cur=s;ch=parts(s.x);i=0;on=1;$('p').classList.add('on');$('pt').textContent=s.t;$('pa').textContent='⏸';D.close();speak()}function speak(){if(!on||i>=ch.length){on=0;$('ps').textContent='再生完了';$('pa').textContent='↻';$('pg').style.width='100%';return}let u=new SpeechSynthesisUtterance(ch[i]);u.lang='ja-JP';u.rate=v;let w=voice();if(w)u.voice=w;u.onend=()=>{if(on){i++;up();setTimeout(speak,70)}};u.onerror=a=>{if(!['canceled','interrupted'].includes(a.error))$('ps').textContent='再生エラー'};sy.speak(u);up()}function up(){$('ps').textContent=`${Math.min(i+1,ch.length)} / ${ch.length}`;$('pg').style.width=i/Math.max(1,ch.length)*100+'%'}function move(n){let k=Math.max(0,S.findIndex(x=>cur&&x.id===cur.id));start(S[(k+n+S.length)%S.length])}$('q').oninput=a=>draw(a.target.value);$('cl').onclick=()=>D.close();$('go').onclick=()=>start();$('pa').onclick=()=>{if(!cur)return;if(!on){start(cur);return}if(sy.paused){sy.resume();$('pa').textContent='⏸'}else{sy.pause();$('pa').textContent='▶'}};$('st').onclick=()=>{sy.cancel();on=0;$('ps').textContent='停止';$('pa').textContent='↻'};$('pr').onclick=()=>move(-1);$('nx').onclick=()=>move(1);document.querySelectorAll('.r').forEach(b=>b.onclick=()=>{v=+b.dataset.v;document.querySelectorAll('.r').forEach(x=>x.classList.toggle('on',x===b));if(on){sy.cancel();setTimeout(speak,70)}});draw();</script>
